[package]
name = "iamlint"
version = "0.1.0"
edition = "2021"
description = "Lints an AWS IAM policy JSON document for overly-permissive statements — wildcard action+resource combos, sensitive actions with no Condition, wildcard Principal"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/iamlint"
readme = "README.md"
keywords = ["aws", "iam", "security", "policy", "lint"]
categories = ["command-line-utilities"]

[lib]
name = "iamlint"
path = "src/lib.rs"

[[bin]]
name = "iamlint"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
